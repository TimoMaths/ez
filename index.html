<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bọn Mày Bị Đớ À?</title>
    <!-- Tailwind CSS for modern utility-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Inter and playful typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            overflow-x: hidden;
        }
        /* Custom glowing animations */
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(239, 68, 68, 0.6), 0 0 40px rgba(239, 68, 68, 0.4); transform: scale(1); }
            50% { text-shadow: 0 0 35px rgba(239, 68, 68, 0.9), 0 0 60px rgba(239, 68, 68, 0.7); transform: scale(1.03); }
        }
        .pulse-text {
            animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .floating {
            animation: floatAnim 3s infinite ease-in-out;
        }
        @keyframes wobbleEmoji {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        .wobble {
            animation: wobbleEmoji 0.5s infinite ease-in-out alternate;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 min-h-screen text-white flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <header class="w-full p-4 flex justify-end items-center max-w-6xl mx-auto">
        <button onclick="triggerConfetti()" class="bg-yellow-400 hover:bg-yellow-300 text-purple-950 font-bold px-4 py-2 rounded-full shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center gap-2">
            <i class="fa-solid fa-face-laugh-squint"></i> Bấm để tỉnh táo!
        </button>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center px-4 text-center my-8">
        
        <!-- Emoji wobble header icon -->
        <div class="text-6xl md:text-8xl mb-4 wobble">
            🤪🌀
        </div>

        <!-- Main Center Text -->
        <h1 class="text-5xl md:text-8xl font-black tracking-wider uppercase mb-8 pulse-text bg-gradient-to-r from-red-400 via-yellow-300 to-pink-400 bg-clip-text text-transparent">
            bọn mày bị đớ à
        </h1>

        <!-- "Tại Sao?" Action Section -->
        <div class="mb-12">
            <button onclick="toggleWhyModal()" class="group relative inline-flex items-center gap-3 px-8 py-4 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-bold text-xl rounded-2xl shadow-xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-pink-500/50 active:translate-y-0">
                <i class="fa-solid fa-circle-question text-2xl group-hover:rotate-180 transition duration-500"></i>
                Tại Sao?
            </button>
        </div>

        <!-- Section: những đứa bị đớ -->
        <div class="w-full max-w-4xl bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-6 md:p-8 shadow-2xl floating">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-white/10">
                <div class="flex items-center gap-3">
                    <div class="bg-red-500/20 p-3 rounded-2xl text-red-400 text-2xl">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-2xl font-bold text-yellow-300">những đứa bị đớ</h2>
                    </div>
                </div>
                <div class="mt-4 md:mt-0 flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                    <input type="text" id="victimInput" placeholder="Nhập tên..." class="bg-purple-950/60 border border-white/20 rounded-xl px-4 py-2 text-white placeholder-purple-400 focus:outline-none focus:border-pink-500 text-sm w-full">
                    <button onclick="addVictim()" class="bg-pink-600 hover:bg-pink-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow-md whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i> Thêm
                    </button>
                </div>
            </div>

            <!-- Error message container -->
            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-500/30 border border-red-500/50 text-red-200 text-sm rounded-xl text-left">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> Tên này không được phép thêm vào danh sách!
            </div>

            <!-- Victims Grid/List Container -->
            <div id="victimsList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 text-left">
                <!-- Dynamic Items will be rendered here -->
            </div>
        </div>

    </main>

    <div id="whyModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gradient-to-br from-purple-900 to-indigo-950 border border-pink-500/40 rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl transform transition-all scale-95 opacity-0 duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-3xl font-black text-yellow-300 flex items-center gap-3 tracking-wide">
                    <i class="fa-solid fa-lightbulb"></i> Tại sao?
                </h3>
                <button onclick="toggleWhyModal()" class="text-purple-300 hover:text-white text-xl p-2 rounded-full hover:bg-white/10">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <ul class="space-y-3 text-purple-200 text-left mb-6 font-medium">
                <li class="flex items-start gap-3 bg-white/5 p-3.5 rounded-xl border border-white/10">
                    <i class="fa-solid fa-check text-pink-400 mt-1"></i>
                    <span>mấy bọn nói Thế Vinh bị đớ là mấy bọn tuất</span>
                </li>
                <li class="flex items-start gap-3 bg-white/5 p-3.5 rounded-xl border border-white/10">
                    <i class="fa-solid fa-check text-pink-400 mt-1"></i>
                    <span>dog dog dog dog dog</span>
                </li>
                <li class="flex items-start gap-3 bg-white/5 p-3.5 rounded-xl border border-white/10">
                    <i class="fa-solid fa-check text-pink-400 mt-1"></i>
                    <span>bọn mày bị ngơ à nói người ta bị đớ</span>
                </li>
            </ul>
            <button onclick="handleApologyClick()" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:opacity-90 active:scale-98 transition text-center flex items-center justify-center gap-2">
                <span>xin lỗi , tôi là thằng ngu và bị đớ</span> 🎉
            </button>
        </div>
    </div>

    <footer class="w-full text-center py-4 text-purple-300 text-xs md:text-sm border-t border-white/10 bg-black/20">
        Created with 🤪 &copy; 2026.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <script>
        // Initial list of "đớ" victims
        let victims = [];

        // Render victims list on load
        function renderVictims() {
            const container = document.getElementById('victimsList');
            container.innerHTML = '';
            
            if (victims.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-purple-300 italic py-4">Chưa có tên nào trong danh sách.</p>`;
                return;
            }

            victims.forEach((victim, index) => {
                container.innerHTML += `
                    <div class="bg-purple-900/40 border border-white/10 rounded-2xl p-4 flex flex-col justify-between hover:border-pink-500/50 transition shadow-md group">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-lg text-white">${escapeHtml(victim.name)}</h3>
                            <button onclick="removeVictim(${index})" class="text-purple-400 hover:text-red-400 opacity-60 group-hover:opacity-100 transition p-1"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        // Add a new victim with strict name block list
        function addVictim() {
            const input = document.getElementById('victimInput');
            const errorMessage = document.getElementById('errorMessage');
            const name = input.value.trim();
            
            // Prohibited names check (case insensitive)
            const normalizedName = name.toLowerCase();
            const forbiddenKeywords = ["vinh", "thế vinh", "mạc thế vinh"];
            
            const isForbidden = forbiddenKeywords.some(keyword => normalizedName.includes(keyword));

            if (isForbidden) {
                errorMessage.classList.remove('hidden');
                input.classList.add('border-red-500');
                return;
            } else {
                errorMessage.classList.add('hidden');
                input.classList.remove('border-red-500');
            }

            if (!name) return;

            victims.push({ name: name });
            input.value = '';
            renderVictims();
            triggerConfetti();
        }

        // Remove a victim
        function removeVictim(index) {
            victims.splice(index, 1);
            renderVictims();
        }

        // Toggle Why Modal
        function toggleWhyModal() {
            const modal = document.getElementById('whyModal');
            const content = document.getElementById('modalContent');
            
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    content.classList.remove('scale-95', 'opacity-0');
                    content.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        // Handle clicking the updated apology button inside modal
        function handleApologyClick() {
            toggleWhyModal();
            triggerFireworkShow();
        }

        // Trigger basic confetti burst
        function triggerConfetti() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Spectacular multi-stage firework show
        function triggerFireworkShow() {
            const count = 200;
            const defaults = {
                origin: { y: 0.7 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 26,
                startVelocity: 55,
            });
            fire(0.2, {
                spread: 60,
            });
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                scalar: 1.2
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 45,
            });
        }

        // Utility to prevent XSS
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize on window load
        window.onload = function() {
            renderVictims();
            
            // Add keypress handler for input
            document.getElementById('victimInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addVictim();
                }
            });
        };
    </script>
</body>
</html>
